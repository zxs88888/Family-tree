      <p>
        <strong>祖辈</strong> → 祖父━祖母<br>
        <strong>一世</strong> → 兄A · 永康(+陈氏/唐氏/徐氏/肖氏) · 兄B(+嫂)<br>
        <strong>二世</strong> → 树烈、树达、树陆、树炎★、树艺、树牧、树森━葛金莲<br>
        <strong>三世</strong> → 树炎有2妻(杨氏/万氏) → 熙杨、熙涵★<br>
        <strong>四世</strong> → 熙涵━夏凡<br>
        <strong>五世</strong> → 廖舜君(2015)、廖舜珵(2018)<br>
        <br>
        全部实线，红色粗线=婚姻，棕色细线=亲子。<br>
        递归规则贯穿始终，每代布局一致。
      </p>
