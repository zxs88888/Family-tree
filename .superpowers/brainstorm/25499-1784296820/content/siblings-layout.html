    <div class="card-body">
      <h3>兄弟 + 多妻共存方案</h3>
      <p>
        <strong>核心思路</strong>：每个兄弟是一个"列"，列宽 = 他家庭子树的最大宽度。<br>
        永康列最宽（4妻7子），兄弟列窄（1妻或无妻）。<br>
        兄弟并排挂在父母的子女横线上，互不干扰。<br>
        <strong>递归规则</strong>：每一代都适用同一条规则 — 夫妻并排 → 子女向下 → 多妻分母亲挂。
